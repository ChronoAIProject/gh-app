name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: 1.23.2
      - name: Install required shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          command -v bash
          command -v zsh
      - name: Run acceptance gate
        run: make verify
      - name: Exercise release cross-builds
        run: make dist
