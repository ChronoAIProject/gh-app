name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.23.2
      - name: Install required shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          command -v bash
          command -v zsh
      - name: Run acceptance gate
        run: make verify
      - name: Exercise release cross-builds
        run: make dist
